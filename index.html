<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA Test-Ahead Priorities</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--ink2:#5a6676;--line:#dde2ea;--accent:#2457c5;--g1:#c0392b;--g2:#d97b00;--g3:#2457c5;--g4:#5a6676}
  @media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212a;--ink:#e8ecf2;--ink2:#9aa6b6;--line:#2c3542;--accent:#6c9bff;--g1:#ff7b6b;--g2:#ffb04d;--g3:#6c9bff;--g4:#9aa6b6}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
  main{max-width:900px;margin:0 auto;padding:24px 16px 60px}
  h1{margin:0 0 4px;font-size:24px}
  .meta{color:var(--ink2);font-size:13px;margin-bottom:14px}
  .rule{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;margin:14px 0 18px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  input[type=search]{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
  button{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
  button:hover{border-color:var(--accent)}
  .grp{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .grp>header{display:flex;gap:10px;align-items:baseline;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .grp .id{font-weight:700;font-size:18px;min-width:34px}
  .grp .count{margin-left:auto;color:var(--ink2);font-size:13px}
  .desc{padding:8px 14px;color:var(--ink2);font-size:13.5px;border-bottom:1px solid var(--line)}
  ol{list-style:none;margin:0;padding:0;counter-reset:n}
  li{display:flex;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
  li:last-child{border-bottom:0}
  li:before{counter-increment:n;content:counter(n);color:var(--ink2);min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
  li a{color:var(--accent);font-weight:600;text-decoration:none;white-space:nowrap}
  li a:hover{text-decoration:underline}
  .t{flex:1}.note{display:block;color:var(--ink2);font-size:12.5px}
  .empty{padding:12px 14px;color:var(--ink2);font-style:italic}
  .g1 .id{color:var(--g1)}.g2 .id{color:var(--g2)}.g3 .id{color:var(--g3)}.g4 .id{color:var(--g4)}
  .hide{display:none}
  .btn{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);text-decoration:none}
  .jl{display:inline-block;margin-left:8px;color:var(--accent);font-weight:600;text-decoration:none}
  #status{font-size:12.5px;color:var(--ink2)}
</style>
</head>
<body>
<main>
  <h1 id="title">QA Test-Ahead Priorities</h1>
  <div class="meta"><span id="updated"></span> <span id="status"></span></div>
  <div class="rule" id="rule"></div>
  <div class="meta">This page holds case numbers only. Click a number, or "See titles and status in Jira", and sign in to Jira with your own login to see the details.</div>
  <div class="bar">
    <input type="search" id="q" placeholder="Filter by case number or words in the title">
    <button id="reload">Reload list</button>
    <button id="toggle">Collapse all</button>
    <a id="alljira" class="btn" href="#" target="_blank" rel="noopener">All cases in Jira</a>
  </div>
  <div id="groups"></div>
</main>
<script>
/* Where the live list lives. The page asks this address for the newest list every time it opens.
   If it cannot reach it (offline, or the address is not set up yet), it shows the list that was
   saved into this file when it was built, and says so at the top. */
const DATA_URL = "https://connorj-tcs.github.io/qa-test-priorities/cases.json";
const JIRA = "https://arinet.atlassian.net/browse/";
const SNAPSHOT = {"updated": "2026-10-19", "groups": [{"id": "G1", "cases": []}, {"id": "G2", "cases": ["TWHD-4734", "TWHD-4736"]}, {"id": "G3", "cases": []}, {"id": "G4", "cases": []}]};
const META = {"title": "QA Test-Ahead Priorities", "rule": "The current sprint always comes first. Use these groups only when nothing in the current sprint is ready to test and you have capacity to test ahead.", "groups": [{"id": "G1", "name": "Bugs in the next sprint", "desc": "Bugs in the very next sprint only (not later sprints), especially ones that are ready to test."}, {"id": "G2", "name": "Last quarter's epics", "desc": "Any case that is ready for build or ready for QA in TWHD-3290, TWHD-4255 or TWHD-4377. Test and put these to bed as soon as possible."}, {"id": "G3", "name": "The current PI plan, in order", "desc": "Cases from the PI plan, in the order the PI plan lists them."}, {"id": "G4", "name": "Everything else on your list", "desc": "Anything not in G1 to G3 that is already on your list, including released cases not yet tested."}]};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let data = null, collapsed = false;

const jql = keys => JIRA.replace("/browse/", "/issues/") + "?jql=" + encodeURIComponent("key in (" + keys.join(",") + ") ORDER BY key ASC");
function render(){
  if(!data) return;
  const q = $("#q").value.trim().toLowerCase();
  $("#title").textContent = META.title;
  $("#updated").textContent = data.updated ? "List updated " + data.updated + "." : "";
  $("#rule").textContent = META.rule;
  const all = [];
  $("#groups").innerHTML = META.groups.map(m => {
    const g = (data.groups.find(x => x.id === m.id) || {cases: []}), keys = g.cases || [];
    all.push(...keys);
    const shown = keys.map((k, i) => [k, i]).filter(([k]) => !q || k.toLowerCase().includes(q));
    const body = shown.length
      ? "<ol>" + shown.map(([k, i]) => `<li value="${i + 1}"><a href="${JIRA}${esc(k)}" target="_blank" rel="noopener">${esc(k)}</a></li>`).join("") + "</ol>"
      : `<div class="empty">${keys.length ? "No case matches the filter." : "Nothing in this group right now."}</div>`;
    const more = keys.length ? ` <a class="jl" href="${jql(keys)}" target="_blank" rel="noopener">See titles and status in Jira</a>` : "";
    return `<section class="grp ${esc(m.id.toLowerCase())}"><header data-g="${esc(m.id)}"><span class="id">${esc(m.id)}</span><strong>${esc(m.name)}</strong><span class="count">${keys.length} case${keys.length === 1 ? "" : "s"}</span></header>
      <div class="body ${collapsed ? "hide" : ""}"><div class="desc">${esc(m.desc)}${more}</div>${body}</div></section>`;
  }).join("");
  $("#alljira").href = all.length ? jql(all) : "#";
  $("#alljira").classList.toggle("hide", !all.length);
  document.querySelectorAll("header[data-g]").forEach(h => h.onclick = () => h.nextElementSibling.classList.toggle("hide"));
}
async function load(){
  $("#status").textContent = "Checking for the newest list...";
  try {
    if(!DATA_URL || DATA_URL.startsWith("__")) throw new Error("no address set");
    const res = await fetch(DATA_URL + (DATA_URL.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache: "no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    data = await res.json();
    $("#status").textContent = "Showing the newest list.";
  } catch(e){
    data = SNAPSHOT;
    $("#status").textContent = data ? "Could not reach the live list (" + e.message + "). Showing the list saved in this file, which may be out of date." : "Could not load the list: " + e.message;
  }
  render();
}
$("#q").oninput = render;
$("#reload").onclick = load;
$("#toggle").onclick = () => { collapsed = !collapsed; $("#toggle").textContent = collapsed ? "Expand all" : "Collapse all"; render(); };
load();
</script>
</body>
</html>
